name: "CodeQL Analysis"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '30 20 * * 4' # Runs weekly on Thursdays at 20:30 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          pkg-config \
          libcairo2-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libimlib2-dev \
          libpango1.0-dev \
          librsvg2-dev \
          libstartup-notification0-dev \
          libx11-dev \
          libxcomposite-dev \
          libxdamage-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxext-dev \
          libxrender-dev \
          libunwind-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended # Options: security-extended, security-and-quality

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build Project
      run: |
        cd build
        make -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
